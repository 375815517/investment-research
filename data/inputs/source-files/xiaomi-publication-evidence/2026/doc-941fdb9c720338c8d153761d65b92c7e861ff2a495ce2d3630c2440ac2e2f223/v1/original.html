        function PreselectYear(preSelect) {
            // define the elements to preselect
            $("#clearAlleasySelect").trigger('click');
            $('.mulpitply_checkbox_style').each(function () {
                // check if the current item value is in the array
                if ($.inArray($(this).val(), preSelect) != -1) {
                    // trigger a click event in order to preselect the item
                    $(this).trigger('click');
                    $("input[value='" + preSelect + "']").prop('checked', true);
                }
            });
        }
        function GetYeardata(strPeriodType, chkBox, maxYearSelection) {
            if (maxYearSelection <= 1) {
                $(".mulpitply_checkbox_style").each(function () {
                    $(this).prop("checked", false);
                });

                if ($(chkBox) != null) {
                    $(chkBox).prop("checked", true);
                }
            }
            val = [];
            $(".mulpitply_checkbox_style:checked").each(function () {
                val.push($(this).val());
            });
            var valunique = val.filter(function (itm, i, val) {
                return i == val.indexOf(itm);
            });
            var selectedval = valunique.join(",");
            if (selectedval.length > 0) {
                PR.selectPeriod(selectedval, strPeriodType);
            }
            else {
                var preSelect = ["2026"];
                PreselectYear(preSelect);
            }

            if (PR.maxYearsSelection == 1) {
                $('.options').hide();
            }

        }

        var observer = new MutationObserver(function () {
            var images = document.querySelectorAll('.PressRelease-Attachment img');

                if (!img.getAttribute('alt') || img.getAttribute('alt').trim() === '') {
                    img.setAttribute('alt', 'Download File');
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        });
